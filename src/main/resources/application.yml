spring:
  application:
    name: capstone-taskmanager
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/capstone
    username: capstone
    password: capstone
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
server:
  port: 8090
app:
  jwt:
    secret: "change-me-to-a-long-random-string-at-least-32-bytes-for-HS256-signing"
    expiration-minutes: 60